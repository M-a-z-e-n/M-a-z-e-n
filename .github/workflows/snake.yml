name: 🐍 Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: M-a-z-e-n
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff4500&color_dots=#ff6347,#ff4500,#ff0000,#8b0000,#ff8c00&color_empty=#1a1a2e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff4500&color_dots=#ff6347,#ff4500,#ff0000,#8b0000,#ff8c00

      - name: 🚀 Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}